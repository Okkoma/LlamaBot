name: Build

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

  push:
    branches: [ main ]   # utile pour act

  workflow_dispatch:

env:
  QT_VERSION: '6.10.2'
  QT_INSTALL_DIR: ${{ github.workspace }}/Qt  
  BUILD_TYPE: Release

jobs:
  build-desktop:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.actor == 'nektos/act' }}
    timeout-minutes: 40
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            cmake_generator: "Unix Makefiles"
          - os: windows-latest
            name: Windows
            cmake_generator: "Visual Studio 17 2022"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # Récupère le commit précis du test
          submodules: recursive

      - name: Install Qt
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          modules: 'qtmultimedia qt5compat qtshadertools'
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libvulkan-dev glslc libssl-dev libfontconfig1-dev libjpeg-dev libopenjp2-7-dev libblas-dev

      - name: Install Windows Dependencies
        if: runner.os == 'Windows' && github.actor != 'nektos/act'
        shell: pwsh
        run: |
          vcpkg install libjpeg-turbo openjpeg vulkan shaderc --triplet x64-windows
          $GLSLC_PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\shaderc"
          echo $GLSLC_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: bash
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        run: |
          CMAKE_ARGS=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DGGML_BLAS=OFF"
          fi
          cmake -B build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DGGML_CUDA=OFF -DBUILD_TEST=OFF $CMAKE_ARGS

      - name: Build
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Install
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        run: cmake --install build

      - name: Deploy & Create AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=$(find ${{ env.QT_INSTALL_DIR }} -name qmake -type f | grep "gcc_64/bin/qmake" | head -n 1)
          export PATH=$(dirname $QMAKE):$PATH
          export QML_SOURCES_PATHS="Source/Application/qml"
          export LINUXDEPLOY_EXCLUDED_LIBRARIES="libqtiff.so;libqsqloci.so;libqsqlodbc.so;libqsqlpsql.so;libqsqlmimer.so;libqsqlibase.so"
          export LINUXDEPLOY_OUTPUT_VERSION="0.1.1"
          ./linuxdeploy-x86_64.AppImage \
              --appdir="./exe" \
              --executable="./exe/bin/LlamaBot" \
              --desktop-file="./exe/share/applications/llamabot.desktop" \
              --icon-file="./exe/share/icons/hicolor/128x128/apps/llamabot.png" \
              --icon-file="./exe/share/icons/hicolor/256x256/apps/llamabot.png" \
              --icon-file="./exe/share/icons/hicolor/512x512/apps/llamabot.png" \
              --plugin=qt \
              --output=appimage
          rm -rf exe

      - name: Deploy Windows Dependencies
        if: runner.os == 'Windows' && github.actor != 'nektos/act'
        shell: pwsh
        run: |
          $WindeployqtPath = Get-ChildItem -Path "${{ env.QT_INSTALL_DIR }}" -Filter "windeployqt.exe" -Recurse | Select-Object -ExpandProperty FullName -First 1
          if (-not $WindeployqtPath) {
              Write-Error "no windeployqt.exe in ${{ env.QT_INSTALL_DIR }}"
              exit 1
          }
          Write-Host "windeployqt path: $WindeployqtPath"
          $ExePath = (Join-Path (Get-Location) "exe/bin/LlamaBot.exe").Replace("/", "\")
          & $WindeployqtPath --qmldir Source/Application/qml --no-translations --compiler-runtime $ExePath
          Compress-Archive -Path "exe/*" -DestinationPath "LlamaBot-Windows.zip" -Force
          Remove-Item -Recurse -Force exe

      - name: Upload Artifacts
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-Artifacts
          path: |
            *.AppImage
            build/LlamaBot-*.zip
  
  build-android:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.actor == 'nektos/act' }}
    timeout-minutes: 40  
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # Récupère le commit précis du test
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }} # Optional if signing
        run: |
          # Use qt-cmake from PATH (added by install-qt-action) which handles toolchain setup
          # Ensure ANDROID_NDK_ROOT is set (GitHub runners usually default to ANDROID_NDK_HOME)
          export ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}
          
          qt-cmake -B build-android -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DGGML_VULKAN=OFF \
            -DBUILD_TEST=OFF 
          
          cmake --build build-android --config Release --target apk --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Artifacts
          path: ./build-android/Source/Application/android-build/build/outputs/apk/release/*.apk

