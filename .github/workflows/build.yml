name: Build

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

  push:
    branches: [ main ]   # utile pour act

  workflow_dispatch:

env:
  QT_VERSION: '6.10.2'
  QT_INSTALL_DIR: ${{ github.workspace }}/Qt  
  BUILD_TYPE: Release

jobs:
  build-desktop:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.actor == 'nektos/act' }}
    timeout-minutes: 40
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            cmake_generator: "Unix Makefiles"
          - os: windows-latest
            name: Windows
            cmake_generator: "Visual Studio 17 2022"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # Récupère le commit précis du test
          submodules: recursive

      - name: Install Qt
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          modules: 'qtmultimedia qt5compat qtshadertools'
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libvulkan-dev libssl-dev libfontconfig1-dev libjpeg-dev libopenjp2-7-dev libblas-dev

      - name: Install Windows Dependencies
        if: runner.os == 'Windows' && github.actor != 'nektos/act'
        shell: pwsh
        run: |
          vcpkg install libjpeg-turbo openjpeg --triplet x64-windows

      - name: Configure CMake
        shell: bash
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        run: |
          CMAKE_ARGS=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DGGML_BLAS=OFF"
          fi
          cmake -B build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TEST=OFF $CMAKE_ARGS

      - name: Build
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Install
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        run: cmake --install build

      - name: Package
        if: (runner.os == 'Windows' && github.actor != 'nektos/act') || runner.os == 'Linux'
        shell: bash
        run: |
          cd build
          cpack .

      - name: Upload Artifacts
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-Artifacts
          path: ./build/LlamaBot*.zip

  build-android:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.actor == 'nektos/act' }}
    timeout-minutes: 40  
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # Récupère le commit précis du test
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }} # Optional if signing
        run: |
          # Use qt-cmake from PATH (added by install-qt-action) which handles toolchain setup
          # Ensure ANDROID_NDK_ROOT is set (GitHub runners usually default to ANDROID_NDK_HOME)
          export ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}
          
          qt-cmake -B build-android -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DGGML_VULKAN=OFF \
            -DBUILD_TEST=OFF 
          
          cmake --build build-android --config Release --target apk --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Artifacts
          path: ./build-android/Source/Application/android-build/build/outputs/apk/release/*.apk

