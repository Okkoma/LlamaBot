name: Build

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

  push:
    branches: [ main ]   # utile pour act

  workflow_dispatch:

env:
  QT_VERSION: '6.10.2'
  QT_INSTALL_DIR: ${{ github.workspace }}/Qt  
  BUILD_TYPE: Release

jobs:
  build-desktop:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.actor == 'nektos/act' }}
    timeout-minutes: 40
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            cmake_generator: "Unix Makefiles"
            cmake_options: "-DGGML_BLAS=ON"
            executable_path: "./build/bin/LlamaBot"
            artifact_name: "LlamaBot-Linux.tar.gz"
          - os: windows-latest
            name: Windows
            cmake_generator: "Visual Studio 17 2022"
            cmake_options: "-DGGML_BLAS=OFF"
            executable_path: "./build/bin/LlamaBot.exe"
            artifact_name: "LlamaBot-Windows.zip"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # Récupère le commit précis du test
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          modules: 'qtmultimedia qt5compat qtshadertools'
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libvulkan-dev libssl-dev libfontconfig1-dev libjpeg-dev libopenjp2-7-dev libblas-dev

      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libjpeg-turbo openjpeg --triplet x64-windows

      - name: Configure CMake
        shell: bash
        run: |
          CMAKE_ARGS=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          fi
          cmake -B build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TEST=ON $CMAKE_ARGS

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Test
        run: |
          ctest --test-dir build \
                --build-config ${{ env.BUILD_TYPE }} \
                --output-on-failure \
                --stop-on-failure \
                --timeout 60 \
                -j 1
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Prepare Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Run windeployqt to copy dependencies
          $windeployqt = (Get-Command windeployqt).Source
          & $windeployqt --release --compiler-runtime --no-translations ${{ matrix.executable_path }}
          
          # Compress
          Compress-Archive -Path ./build/bin/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Prepare Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} ${{ matrix.executable_path }}

      - name: Upload Artifacts
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-Artifacts
          path: ${{ matrix.artifact_name }}

  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # Récupère le commit précis du test
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }} # Optional if signing
        run: |
          # Use qt-cmake from PATH (added by install-qt-action) which handles toolchain setup
          # Ensure ANDROID_NDK_ROOT is set (GitHub runners usually default to ANDROID_NDK_HOME)
          export ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}
          
          qt-cmake -B build-android -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DGGML_VULKAN=OFF \
            -DBUILD_TEST=OFF 
          
          cmake --build build-android --config Release --target apk --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Artifacts
          path: build-android/android-build/*.apk

